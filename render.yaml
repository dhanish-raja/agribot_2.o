services:
  - type: web
    name: agribot-ai-service
    runtime: python
    region: singapore
    plan: free
    rootDir: agri-chatbot/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: LLM_API_KEYS
        sync: false
